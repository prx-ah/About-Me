<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skills - Alex Johnson</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<script>
  fetch('navbar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('navbar').innerHTML = data;
    });
</script>
<body>
  <header>
    <div id="navbar"></div>
  </header>


  <main class="container">
    <h1 class="section-title">My Skills</h1>

    <section class="skills-section">
      <div class="skill-box">
        <h3>UI/UX Design</h3>
        <div class="skill">
          <span>Figma</span>
          <div class="progress-bar"><div style="width: 90%;">90%</div></div>
        </div>
        <div class="skill">
          <span>Adobe XD</span>
          <div class="progress-bar"><div style="width: 80%;">80%</div></div>
        </div>
        <div class="skill">
          <span>Photoshop</span>
          <div class="progress-bar"><div style="width: 70%;">70%</div></div>
        </div>
      </div>

      <div class="skill-box">
        <h3>Frontend Development</h3>
        <div class="skill">
          <span>HTML/CSS</span>
          <div class="progress-bar"><div style="width: 95%;">95%</div></div>
        </div>
        <div class="skill">
          <span>JavaScript</span>
          <div class="progress-bar"><div style="width: 90%;">90%</div></div>
        </div>
        <div class="skill">
          <span>React</span>
          <div class="progress-bar"><div style="width: 85%;">85%</div></div>
        </div>
      </div>

      <div class="skill-box">
        <h3>Backend Development</h3>
        <div class="skill">
          <span>PHP</span>
          <div class="progress-bar"><div style="width: 75%;">75%</div></div>
        </div>
        <div class="skill">
          <span>Node.js</span>
          <div class="progress-bar"><div style="width: 65%;">65%</div></div>
        </div>
      </div>

      <div class="skill-box">
        <h3>Tools & Platforms</h3>
        <div class="skill">
          <span>WordPress</span>
          <div class="progress-bar"><div style="width: 85%;">85%</div></div>
        </div>
        <div class="skill">
          <span>Git</span>
          <div class="progress-bar"><div style="width: 80%;">80%</div></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
